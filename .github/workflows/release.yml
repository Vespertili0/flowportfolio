name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build, Test, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Install uv & Set up Python
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Build a binary wheel and a source tarball
      run: uv build

    - name: Verify build
      run: |
        uv pip install dist/*.whl
        mkdir tmp_test
        cd tmp_test
        uv run python -c "import flowportfolio; print('Successfully imported flowportfolio version:', flowportfolio.__version__)"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        generate_release_notes: true

  docker-publish:
    name: Build & Publish Multi-Arch Images
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── base image ────────────────────────────────────────────────
      - name: Extract metadata for base image
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vespertili0/flowportfolio
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build base image locally (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: flowportfolio:smoke-test
          cache-from: type=gha,scope=flowportfolio-base
          cache-to: type=gha,mode=max,scope=flowportfolio-base

      - name: Smoke-test base image
        run: |
          docker run --rm flowportfolio:smoke-test \
            python -c "import flowportfolio; print('base smoke-test OK:', flowportfolio.__version__)"

      - name: Build and push base multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha,scope=flowportfolio-base
          cache-to: type=gha,mode=max,scope=flowportfolio-base

      # ── orchestrator image ────────────────────────────────────────
      - name: Extract metadata for orchestrator image
        id: meta-orchestrator
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vespertili0/flowportfolio
          tags: |
            type=semver,pattern={{version}},suffix=-prefect
            type=raw,value=latest-prefect,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build orchestrator image locally (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: orchestrator
          platforms: linux/amd64
          load: true
          tags: flowportfolio:smoke-test-prefect
          cache-from: type=gha,scope=flowportfolio-orchestrator
          cache-to: type=gha,mode=max,scope=flowportfolio-orchestrator

      - name: Smoke-test orchestrator image
        run: |
          docker run --rm flowportfolio:smoke-test-prefect \
            python -c "import flowportfolio, prefect; print('orchestrator smoke-test OK:', flowportfolio.__version__)"

      - name: Build and push orchestrator multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: orchestrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-orchestrator.outputs.tags }}
          labels: ${{ steps.meta-orchestrator.outputs.labels }}
          cache-from: type=gha,scope=flowportfolio-orchestrator
          cache-to: type=gha,mode=max,scope=flowportfolio-orchestrator
