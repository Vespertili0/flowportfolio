[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowportfolio"
version = "0.4.0"
description = "A fluent portfolio experimentation API built on top of skfolio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vespertili0"}]

dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=5.0.0",
    "scikit-learn>=1.9.0",
    "skfolio>=0.20.1,<1.0.0",
    "tabulate>=0.9.0",
    "yfinance>=1.5.1",
]

[project.urls]
Homepage = "https://github.com/Vespertili0/flowportfolio"
Repository = "https://github.com/Vespertili0/flowportfolio"
Issues = "https://github.com/Vespertili0/flowportfolio/issues"

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.6",
]

[tool.mypy]
ignore_missing_imports = true
